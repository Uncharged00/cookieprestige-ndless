name: Build Cookie Prestige

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ndless SDK
        run: |
          git clone --depth 1 https://github.com/ndless-nspire/Ndless.git ndless-sdk
          cd ndless-sdk
          make -j2

      - name: Add Ndless tools to PATH
        run: |
          echo "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk/tools" >> "$GITHUB_PATH"

      - name: Build
        run: |
          make

      - name: Upload TNS
        uses: actions/upload-artifact@v4
        with:
          name: cookieprestige-tns
          path: cookieprestige.tns
