name: Build Cookie Prestige

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ndless
        uses: Ziyang-Bai/setup-ndless@v1

      - name: Build game
        run: make

      - name: Upload TNS
        uses: actions/upload-artifact@v4
        with:
          name: cookieprestige-tns
          path: cookieprestige.tns
