name: Build Cookie Prestige

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Ndless
        uses: actions/checkout@v4
        with:
          repository: ndless-nspire/Ndless
          path: ndless-sdk
          submodules: recursive
          fetch-depth: 1

      - name: Build Ndless SDK
        run: |
          cd ndless-sdk
          make -j2

      - name: Add Ndless tools
        run: |
          echo "$GITHUB_WORKSPACE/ndless-sdk/ndless-sdk/bin" >> "$GITHUB_PATH"

      - name: Build game
        run: make

      - name: Upload TNS
        uses: actions/upload-artifact@v4
        with:
          name: cookieprestige-tns
          path: cookieprestige.tns
